[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-dashscope"
dynamic = ["version"]
description = "LiveKit Agents protocol builders for Alibaba DashScope speech"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10.0"
authors = [{ name = "LiveKit", email = "hello@livekit.io" }]
dependencies = []

[tool.hatch.version]
path = "livekit/plugins/dashscope/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]
